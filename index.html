<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --paper:#1d2521; --ink:#e4ebe6; --muted:#9aa8a0; --line:#3a4640;
  --accent:#7fbf9f; --accent-soft:#25382e; --inlaw:#d0b17a; --warn:#e58a5f; --grid:#212a25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --paper:#1d2521; --ink:#e4ebe6; --muted:#9aa8a0; --line:#3a4640;
  --accent:#7fbf9f; --accent-soft:#25382e; --inlaw:#d0b17a; --warn:#e58a5f; --grid:#212a25; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:5}
h1{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;text-wrap:balance;letter-spacing:.005em}

.results{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:260px;background:var(--paper);border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20}

.card .s{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.zoom{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:38px;height:38px;padding:0;font-size:1.1rem}
.legend{position:absolute;left:66px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.74rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;z-index:3;max-width:calc(100% - 140px)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--line);vertical-align:middle;margin-right:5px}
.legend i.m{border-top:2px dashed var(--inlaw)}
.legend b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:5px}
aside{width:380px;max-width:100%;background:var(--paper);border-left:1px solid var(--line);overflow:auto;padding-block:18px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));box-sizing:border-box}
aside h2{font-family:var(--f-display);font-weight:600;font-size:1.5rem;margin:0 0 2px;line-height:1.15;text-wrap:balance}
aside .sub{color:var(--muted);font-size:.85rem;margin-bottom:14px}
aside dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:0 0 14px;font-size:.88rem}
aside dt{color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
aside dd{margin:0;min-width:0;overflow-wrap:anywhere}
aside .mono{font-family:var(--f-mono);font-size:.82rem}
aside .note{background:var(--accent-soft);border-radius:6px;padding:9px 11px;font-size:.84rem;margin:0 0 14px;line-height:1.45}

aside .actions{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
aside .close{float:right}
.rel a{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.intro{font-size:.9rem;line-height:1.55;color:var(--ink)}
.intro p{margin:0 0 10px;max-width:60ch}
.intro h2{margin-bottom:10px}
form .row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
form .hint{font-size:.75rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:3px 4px 3px 10px;font-size:.82rem}
.chip button{border:none;background:none;padding:0 6px;font-size:1rem;line-height:1;color:var(--muted)}
.pbox{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.status{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:.86rem;z-index:4;max-width:min(520px,calc(100% - 32px))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:30}
.confirm{border:1px solid var(--warn);border-radius:6px;padding:10px;margin:8px 0;font-size:.86rem}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:100%;border-left:none;border-top:1px solid var(--line);max-height:55%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .legend{display:none}
  .tools{margin-left:0;width:100%}
  .search{flex-basis:100%}.search input{width:100%;box-sizing:border-box}
  body:not(.has-sel) aside{display:none}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

<header>
  <h1>Stamboom Familie Bos <small id="count"></small></h1>
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="Zoek een naam of plaats" autocomplete="off" aria-label="Zoeken"><div class="results" id="results" hidden></div></div>
    <button id="btnRot" title="Tijdas horizontaal of verticaal">Kantelen</button>
    <a class="btnlink" href="https://tally.so/r/e5DKlJ" target="_blank" rel="noopener">Iets doorgeven</a>
    <button id="btnAdd" hidden>Persoon toevoegen</button>
    <button id="btnExport" hidden>Exporteren</button>
  </div>
</header>
<main>
  <div id="viewport" aria-label="Stamboom, sleep om te verschuiven, scroll om te zoomen">
    <div id="world"><svg id="edges"></svg></div>
    <div id="axis"></div>
    <div class="status" id="status" hidden></div>
    <div id="lock"><form id="lockf"><h2>Stamboom Familie Bos</h2><p>Deze stamboom is afgeschermd. Vul het familiewachtwoord in.</p>
      <input type="password" id="pw" autocomplete="current-password" aria-label="Wachtwoord" placeholder="Wachtwoord">
      <label class="rem"><input type="checkbox" id="rem"> Onthouden op dit apparaat</label>
      <button class="primary" type="submit" id="go">Openen</button><p class="err" id="perr"></p></form></div>
    <div class="legend"><span><i></i>ouder en kind</span><span><i class="m"></i>huwelijk tussen twee takken</span><span><b></b>gegevens controleren</span></div>
    <div class="zoom"><button id="zin" aria-label="Inzoomen">+</button><button id="zout" aria-label="Uitzoomen">−</button><button id="zfit" aria-label="Alles tonen" title="Alles tonen">⤢</button></div>
  </div>
  <aside id="panel"></aside>
</main>

<script>
(() => {
const CW = 168, GAP = 16, PX = 7.5, TOP = 40, LEFT = 80;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let people = new Map(), est = new Map(), pos = new Map(), nodes = [], inlaw = new Set(), anchorOf = new Map(), kids = new Map(), partnersOf = new Map();
let db = null, user = null, canWrite = false, isOwner = false, myId = null, downloads = null;
let selected = null, view = {x: 0, y: 0, k: .6}, minYear = 1650, maxYear = 2030, fitted = false;
let mode = 'view', form = null, confirmDel = false;
let horiz = true; try { horiz = localStorage.getItem('stamboom-orient') !== 'v'; } catch (e) {}
document.body.classList.toggle('horiz', horiz);

/* ---------- data helpers ---------- */
const year = s => { const m = String(s || '').match(/(\d{4})/); return m ? +m[1] : null; };
const fullName = p => [p.v, p.a].filter(Boolean).join(' ') || 'Onbekend';
const shortName = p => (p.roep ? p.roep + ' ' : (p.v || '').split(' ')[0] + ' ') + (p.a || '');
const yrs = p => {
  const b = year(p.gd), d = year(p.od);
  if (!b && !d) return '<span class="est">ca. ' + (est.get(p.id) ?? '?') + '</span>';
  return (b ? '* ' + b : '') + (b && d ? '  ' : '') + (d ? '† ' + d : '');
};
const living = p => !p.od && (year(p.gd) ?? est.get(p.id) ?? 0) > 1926;

function build() {
  partnersOf = new Map();
  const addP = (a, b, r) => { if (!people.has(a) || !people.has(b)) return; if (!partnersOf.has(a)) partnersOf.set(a, []); if (!partnersOf.get(a).some(x => x.id === b)) partnersOf.get(a).push({...r, id: b}); };
  for (const p of people.values()) for (const r of (p.partners || [])) { addP(p.id, r.id, r); addP(r.id, p.id, r); }
  const hasParents = id => (people.get(id)?.ouders || []).some(o => people.has(o));
  anchorOf = new Map(); kids = new Map();
  for (const p of people.values()) {
    const ou = (p.ouders || []).filter(o => people.has(o));
    if (!ou.length) continue;
    let a = ou.find(hasParents);
    if (!a) for (const o of ou) { const q = (partnersOf.get(o) || []).find(r => hasParents(r.id)); if (q) { a = q.id; break; } }
    if (!a) a = ou[0];
    anchorOf.set(p.id, a);
    if (!kids.has(a)) kids.set(a, []); kids.get(a).push(p.id);
  }
  inlaw = new Set();
  for (const p of people.values()) if (!hasParents(p.id) && !kids.has(p.id) && (partnersOf.get(p.id) || []).length) inlaw.add(p.id);
  // a partner that only has in-law partners is itself a node; make sure every in-law hangs on a node
  for (const id of [...inlaw]) if (!(partnersOf.get(id) || []).some(r => !inlaw.has(r.id))) inlaw.delete(id);
  // estimated years
  est = new Map();
  for (const p of people.values()) { const y = year(p.gd); if (y) est.set(p.id, y); }
  for (let it = 0; it < 8; it++) for (const p of people.values()) {
    if (est.has(p.id)) continue;
    const pe = (p.ouders || []).map(o => est.get(o)).filter(Boolean);
    const ce = [...people.values()].filter(c => (c.ouders || []).includes(p.id)).map(c => est.get(c.id)).filter(Boolean);
    const se = (partnersOf.get(p.id) || []).map(r => est.get(r.id)).filter(Boolean);
    let y = pe.length ? Math.max(...pe) + 28 : ce.length ? Math.min(...ce) - 30 : se.length ? se[0] : year(p.od) ? year(p.od) - 50 : null;
    if (y && year(p.od) && y > year(p.od)) y = year(p.od);
    if (y) est.set(p.id, y);
  }
  const ys = [...est.values()];
  minYear = Math.floor((Math.min(...ys, 1700) - 10) / 25) * 25; maxYear = Math.max(...ys, 2010) + 20;
  layout();
}

function cardH(id) { return 58 + 17 * inlawPartners(id).length; }
function inlawPartners(id) { return (partnersOf.get(id) || []).filter(r => inlaw.has(r.id)); }
const Y = y => (horiz ? 40 : TOP) + (y - minYear) * PX;
const mid = id => pos.get(id).y + 29;

function layout() {
  pos = new Map();
  nodes = [...people.values()].filter(p => !inlaw.has(p.id)).map(p => p.id);
  const sortK = id => (est.get(id) ?? 9999);
  for (const [, arr] of kids) arr.sort((a, b) => sortK(a) - sortK(b) || a.localeCompare(b));
  const roots = nodes.filter(id => !anchorOf.has(id)).sort((a, b) => sortK(a) - sortK(b));
  let cursor = horiz ? 50 : LEFT;
  const span = id => horiz ? cardH(id) : CW;
  const gapB = horiz ? 10 : GAP;
  const place = (id, depth) => {
    const ch = (kids.get(id) || []).filter(c => !inlaw.has(c));
    const t = Math.max(Y(est.get(id) ?? minYear), depth);
    const set = b => pos.set(id, horiz ? {x: t, y: b} : {x: b, y: t});
    if (!ch.length) { set(cursor); cursor += span(id) + gapB; return; }
    const start = cursor;
    const childT = t + (horiz ? CW : cardH(id)) + 34;
    ch.forEach(c => place(c, childT));
    const cs = ch.map(c => horiz ? pos.get(c).y + cardH(c) / 2 : pos.get(c).x + CW / 2);
    let b = (Math.min(...cs) + Math.max(...cs)) / 2 - span(id) / 2;
    if (b < start) b = start;
    set(b);
    if (cursor < b + span(id) + gapB) cursor = b + span(id) + gapB;
  };
  roots.forEach(r => { place(r, 0); cursor += horiz ? 40 : 60; });
  render();
}

/* ---------- render ---------- */
function render() {
  const world = $('#world'), svg = $('#edges');
  world.querySelectorAll('.card').forEach(n => n.remove());
  let W = 0, H = 0; for (const [id, p] of pos) { W = Math.max(W, p.x + CW); H = Math.max(H, p.y + cardH(id)); }
  if (horiz) { W = Math.max(W, Y(maxYear) + 60) - 80; H += 60; } else H = Y(maxYear) + 60;
  world.style.width = (W + 80) + 'px'; world.style.height = H + 'px';
  svg.setAttribute('width', W + 80); svg.setAttribute('height', H);
  let g = '';
  for (let y = minYear; y <= maxYear; y += 25) g += horiz ? `<line y1="0" y2="${H}" x1="${Y(y)}" x2="${Y(y)}" stroke="var(--grid)" stroke-width="${y % 100 ? 1 : 2}"/>` : `<line x1="0" x2="${W + 80}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--grid)" stroke-width="${y % 100 ? 1 : 2}"/>`;
  const lineage = selected ? lineageOf(selected) : null;
  // parent-child edges
  for (const [a, arr] of kids) {
    const pa = pos.get(a); if (!pa) continue;
    const ch = arr.filter(c => pos.has(c)); if (!ch.length) continue;
    const on = !lineage || lineage.has(a);
    const col = 'var(--line)';
    if (horiz) {
      const x0 = pa.x + CW, y0 = mid(a), bus = Math.min(...ch.map(c => pos.get(c).x)) - 16;
      const ys = ch.map(mid);
      g += `<path d="M${x0} ${y0} H${bus}" stroke="${col}" stroke-width="1.6" fill="none" opacity="${on ? 1 : .25}"/>`;
      g += `<path d="M${bus} ${Math.min(y0, ...ys)} V${Math.max(y0, ...ys)}" stroke="${col}" stroke-width="1.6" fill="none" opacity="${on ? 1 : .25}"/>`;
      for (const c of ch) { const pc = pos.get(c); const o = !lineage || (lineage.has(c) && lineage.has(a)); g += `<path d="M${bus} ${mid(c)} H${pc.x}" stroke="${o && lineage ? 'var(--accent)' : col}" stroke-width="${o && lineage ? 2.2 : 1.6}" fill="none" opacity="${o ? 1 : .25}"/>`; }
      continue;
    }
    const x0 = pa.x + CW / 2, y0 = pa.y + cardH(a);
    const bus = Math.min(...ch.map(c => pos.get(c).y)) - 16;
    g += `<path d="M${x0} ${y0} V${bus}" stroke="${col}" stroke-width="1.6" fill="none" opacity="${on ? 1 : .25}"/>`;
    const xs = ch.map(c => pos.get(c).x + CW / 2);
    g += `<path d="M${Math.min(x0, ...xs)} ${bus} H${Math.max(x0, ...xs)}" stroke="${col}" stroke-width="1.6" fill="none" opacity="${on ? 1 : .25}"/>`;
    for (const c of ch) { const pc = pos.get(c); const o = !lineage || (lineage.has(c) && lineage.has(a)); g += `<path d="M${pc.x + CW / 2} ${bus} V${pc.y}" stroke="${o && lineage ? 'var(--accent)' : col}" stroke-width="${o && lineage ? 2.2 : 1.6}" fill="none" opacity="${o ? 1 : .25}"/>`; }
  }
  // marriages between two nodes
  const seen = new Set();
  for (const id of nodes) for (const r of (partnersOf.get(id) || [])) {
    if (inlaw.has(r.id) || !pos.has(r.id)) continue;
    const key = [id, r.id].sort().join('|'); if (seen.has(key)) continue; seen.add(key);
    const a = pos.get(id), b = pos.get(r.id);
    let d;
    if (horiz) { const ay = mid(id), by = mid(r.id), lx = Math.min(a.x, b.x) - 40; d = `M${a.x} ${ay} C${lx} ${ay}, ${lx} ${by}, ${b.x} ${by}`; }

function lineageOf(id) {
  const s = new Set([id]);
  const up = x => (people.get(x)?.ouders || []).forEach(o => { if (!s.has(o) && people.has(o)) { s.add(o); up(o); } });
  const down = x => [...people.values()].filter(c => (c.ouders || []).includes(x)).forEach(c => { if (!s.has(c.id)) { s.add(c.id); down(c.id); } });
  up(id); down(id);
  (partnersOf.get(id) || []).forEach(r => s.add(r.id));

  for (const x of [...s]) if (inlaw.has(x)) (partnersOf.get(x) || []).forEach(r => { if (!inlaw.has(r.id) && s.has(x)) {} });

function gedDate(s) { const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC']; const m = String(s || '').match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); if (m) return `${+m[1]} ${M[+m[2] - 1]} ${m[3]}`; const y = year(s); return y ? String(y) : ''; }
function gedcom(all) {

  const fam = (a, b) => { const k = famKey(a, b); if (!fams.has(k)) fams.set(k, {id: 'F' + (fams.size + 1), a, b, kids: [], rel: null}); return fams.get(k); };
  for (const p of all) for (const r of p.partners || []) fam(p.id, r.id).rel = r;
  for (const p of all) { const ou = (p.ouders || []).filter(o => people.has(o)); if (ou.length) fam(ou[0], ou[1]).kids.push(p.id); }
  const famsOf = id => [...fams.values()].filter(f => f.a === id || f.b === id);
  for (const p of all) {
    L.push(`0 @${p.id}@ INDI`, `1 NAME ${p.v || ''} /${p.a || ''}/`); if (p.roep) L.push(`2 NICK ${p.roep}`);
    if (p.gd || p.gp) { L.push('1 BIRT'); if (gedDate(p.gd)) L.push('2 DATE ' + gedDate(p.gd)); if (p.gp) L.push('2 PLAC ' + p.gp); }
    if (p.od || p.op) { L.push('1 DEAT'); if (gedDate(p.od)) L.push('2 DATE ' + gedDate(p.od)); if (p.op) L.push('2 PLAC ' + p.op); }
    if (p.beroep) L.push('1 OCCU ' + p.beroep);
    if (p.notitie) L.push('1 NOTE ' + p.notitie.replace(/\n/g, ' '));
    famsOf(p.id).forEach(f => L.push(`1 FAMS @${f.id}@`));
    [...fams.values()].filter(f => f.kids.includes(p.id)).forEach(f => L.push(`1 FAMC @${f.id}@`));
  }
  for (const f of fams.values()) { L.push(`0 @${f.id}@ FAM`); if (f.a) L.push(`1 HUSB @${f.a}@`); if (f.b) L.push(`1 WIFE @${f.b}@`);
    if (f.rel && (f.rel.datum || f.rel.plaats) && f.rel.soort !== 'relatie') { L.push('1 MARR'); if (gedDate(f.rel.datum)) L.push('2 DATE ' + gedDate(f.rel.datum)); if (f.rel.plaats) L.push('2 PLAC ' + f.rel.plaats); }
    if (f.rel && f.rel.gescheiden) { L.push('1 DIV'); if (gedDate(f.rel.gescheiden)) L.push('2 DATE ' + gedDate(f.rel.gescheiden)); }
    f.kids.forEach(k => L.push(`1 CHIL @${k}@`)); }

}

const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(BLOB.salt), iterations: BLOB.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(BLOB.iv)}, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function open(all) {
  people = new Map(all.map(p => [p.id, p]));
  $('#lock').remove(); build();
  if (pos.has('p2')) focus('p2', .75); else fit();
}
$('#lockf').addEventListener('submit', async e => {
  e.preventDefault(); const pw = $('#pw').value; if (!pw) return;
  $('#go').disabled = true; $('#go').textContent = 'Openen…'; $('#perr').textContent = '';
  try { const all = await unlock(pw); if ($('#rem').checked) { try { localStorage.setItem('stamboom-pw', pw); } catch (x) {} } open(all); }
  catch (x) { $('#perr').textContent = 'Dat wachtwoord klopt niet.'; $('#go').disabled = false; $('#go').textContent = 'Openen'; $('#pw').select(); }
});
(async () => { let pw = null; try { pw = localStorage.getItem('stamboom-pw'); } catch (x) {}
  if (pw) { try { open(await unlock(pw)); return; } catch (x) { try { localStorage.removeItem('stamboom-pw'); } catch (y) {} } }
  $('#pw').focus();
})();
})();
